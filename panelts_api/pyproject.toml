[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panelts-api"
version = "0.1.0"
description = "A forecasting-oriented Python API for the Multiple-Time-Series/PanelTS Hugging Face dataset."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PanelTS contributors"}]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
panelts = "panelts.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["panelts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
